name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows: no stty (the prompts read lines), the E2E tests are skipped (no "script").
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, yaml, zip
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Tests
        run: vendor/bin/phpunit

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, yaml, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: vendor/bin/phpstan --no-progress --error-format=github

  mutation-testing:
    name: Mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, yaml, zip
          coverage: pcov

      - uses: ramsey/composer-install@v3

      # The minimal MSI is in infection.json5; the escaped mutants are shown as annotations.
      - name: Infection
        run: vendor/bin/infection --threads=max --no-progress --logger-github
